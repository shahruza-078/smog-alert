app = "REPLACE-WITH-YOUR-APP-NAME"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/smog.db"
  PORT = "8080"

[mounts]
  source = "smogdata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
